<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Medicamento | GIM-MED</title><style>body{font:17px Arial;background:#eaf5f6;color:#143347}main{max-width:600px;margin:40px auto;background:white;padding:30px;border-radius:16px}form,label{display:grid;gap:12px}input,button{padding:12px;border-radius:8px;border:1px solid #c8dce2}button{background:#078f82;color:white;cursor:pointer}</style></head><body><main><a href="/interfaces/enfermeria/index.html">← Volver</a><h1>Registrar medicamento</h1><p>Existencias guardadas en esta base independiente.</p><form id="m"><label>Código<input name="codigo" required></label><label>Nombre<input name="nombre" required></label><label>Presentación<input name="presentacion" required></label><label>Vía<input name="via" value="Oral" required></label><label>Existencias<input name="stock" type="number" min="0" required></label><button>Guardar</button></form><p id="message"></p></main><script>document.querySelector('#m').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/insumos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});document.querySelector('#message').textContent=r.ok?'Medicamento guardado.':'No se pudo guardar.';if(r.ok)e.target.reset()}</script></body></html>
