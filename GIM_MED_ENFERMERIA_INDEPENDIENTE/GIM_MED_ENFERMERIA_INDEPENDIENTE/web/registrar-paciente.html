<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar paciente | GIM-MED</title><style>body{font:16px Arial, sans-serif;background:#eaf5f6;color:#143347;margin:0}main{max-width:750px;margin:48px auto;padding:30px;background:#fff;border-radius:20px;box-shadow:0 16px 40px #2444}h1{margin:0 0 12px}p{color:#526b78}form{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}label{display:grid;gap:6px;font-weight:bold;font-size:14px}input{padding:12px;border:1px solid #c7d8e0;border-radius:8px;font:inherit}button,.back{display:inline-block;padding:12px 20px;border:0;border-radius:9px;background:#078f82;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer}button{grid-column:1/-1}a.back{margin-bottom:24px}#feedback{min-height:24px}@media(max-width:600px){main{margin:12px;padding:18px}form{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="/" id="back">← Volver al módulo</a><h1>Registrar paciente</h1><p>El expediente se guardará únicamente en la base de datos de este módulo.</p><form id="patient-form"><label>Nombre completo<input name="fullName" required></label><label>Identificación<input name="identification"></label><label>Fecha de nacimiento<input name="birthDate" type="date"></label><label>Tipo de sangre<input name="bloodType" placeholder="O+"></label><label>Teléfono<input name="phone"></label><label>Alergias<input name="allergies" placeholder="Ninguna"></label><button>Guardar expediente</button></form><p id="feedback" role="status"></p></main><script>
(async()=>{let status=await fetch('/api/status').then(r=>r.json());document.querySelector('#back').href=`/interfaces/${status.section}/index.html`;document.querySelector('#patient-form').addEventListener('submit',async e=>{e.preventDefault();let r=await fetch('/api/pacientes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let d=await r.json();document.querySelector('#feedback').textContent=r.ok?`Paciente guardado: ${d.patient.fileNumber}.`:d.message||d.error;if(r.ok)e.target.reset()})})();
</script></body></html>
