<!doctype html>

<!-- Pantalla para la interfaz de administrador, tarea configuracion: navegación, formularios y paneles de esta tarea. -->
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Configuración institucional GIM-MED"><title>Configuración general | GIM-MED</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside id="app-sidebar" class="sidebar"></aside><main class="main-area"><header id="app-header" class="topbar"></header><section class="content"><div class="page-heading"><div><p class="eyebrow">CONFIGURACIÓN DEL SISTEMA</p><h1>Configuración general</h1><p>Actualice los datos institucionales utilizados en reportes, facturas y documentos.</p></div></div><form id="settings-form" class="panel" novalidate><div class="section-title"><div><h2>Información de la clínica</h2><p>Los cambios se guardan automáticamente en este navegador.</p></div></div><div class="form-grid"><label>Nombre de la clínica *<input name="name" required></label><label>RUC *<input name="ruc" required placeholder="Escriba N/A si está pendiente"></label><label>Teléfono *<input name="phone" type="tel" required></label><label>Correo electrónico *<input name="email" type="email" required></label><label>Dirección *<input name="address" required></label><label>Horario de atención *<input name="hours" required></label></div><p id="settings-error" class="form-error"></p><div class="form-actions"><button class="primary-button" type="submit">Guardar configuración</button></div></form></section></main></div><script src="/bootstrap.js"></script><script src="../core/store.js"></script><script src="script.js"></script></body></html>
