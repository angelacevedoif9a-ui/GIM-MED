<!doctype html>

<!-- Pantalla para la interfaz de administrador, tarea reportes: navegación, formularios y paneles de esta tarea. -->
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Reportes transversales de GIM-MED"><title>Reportes | GIM-MED</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside id="app-sidebar" class="sidebar"></aside><main class="main-area"><header id="app-header" class="topbar"></header><section class="content">
  <div class="page-heading"><div><p class="eyebrow">ANÁLISIS TRANSVERSAL</p><h1>Reportes operativos</h1><p>Indicadores clínicos, administrativos, de personal y farmacia.</p></div><button id="report-pdf" class="primary-button" type="button">Descargar como PDF</button></div>
  <section id="report-stats" class="stats-grid"></section>
  <section class="charts-grid"><article class="panel"><h2>Actividad por módulo</h2><canvas id="activity-chart" width="720" height="320" aria-label="Gráfica de actividad por módulo"></canvas></article><article class="panel"><h2>Estado del sistema</h2><div id="system-bars" class="system-bars"></div></article></section>
  <section class="panel report-table"><div class="section-title"><div><p class="eyebrow">ADMINISTRACIÓN Y FARMACIA</p><h2>Reporte transversal consolidado</h2></div><span id="report-date" class="status-badge"></span></div><div class="table-wrap flat"><table><thead><tr><th>Área</th><th>Indicador</th><th>Resultado</th><th>Observación</th></tr></thead><tbody id="report-body"></tbody></table></div></section>
</section></main></div><script src="/bootstrap.js"></script><script src="../core/store.js"></script><script src="script.js"></script></body></html>
